name: Deploy to Cloudflare Workers

# Site estatico puro (HTML/CSS/JS). Nao existe build step.
# Cada push na main publica no Worker, APOS aprovacao do environment "production".

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Os secrets vivem NESTE environment, nao no nivel do repositorio.
    # Qualquer execucao que precise deles para aqui e espera aprovacao
    # do revisor obrigatorio. Job sem "environment: production" nao
    # enxerga o token.
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Snapshot fresco das avaliacoes no HTML publicado (a branch
      # reviews-data cobre o intervalo entre deploys). Sem o secret, usa o
      # data/reviews.json do repositorio.
      - name: Avaliacoes do Google (Local Falcon)
        env:
          LOCALFALCON_API_KEY: ${{ secrets.LOCALFALCON_API_KEY }}
        run: python3 scripts/fetch_reviews.py || echo "::warning::avaliacoes nao atualizadas; segue com o snapshot do repo"

      - name: Header e footer estaticos (nav visivel sem JS)
        run: node scripts/static_nav.js

      - name: Enriquecimento SEO das paginas (OG, schema, LCP, CLS)
        run: python3 scripts/enrich_pages.py

      - name: Gemeos markdown para negociacao de conteudo
        run: python3 scripts/gen_markdown.py

      # CSS minificado so na copia publicada: o css/styles.css do repo
      # continua legivel. 164 KB -> 88 KB (43 -> 17 KB com gzip). Versao
      # fixada; conferido pixel a pixel em 8 paginas no desktop (25/09/2026).
      - name: Minificar CSS
        run: npx --yes lightningcss-cli@1.33.0 --minify --targets '>= 0.25%' css/styles.css -o css/styles.css

      # Portao de qualidade: roda sobre o HTML ja buildado, que e o que vai
      # ao ar. Falhou, nao publica. Ver tests/check_html.py.
      - name: Checagem do HTML (links, head, schema, fatos)
        run: |
          pip install --quiet html5lib
          python3 tests/check_html.py

      - name: Deploy com Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A action instala Wrangler 3.90.0 por padrao, que e antigo demais:
          # nao le wrangler.jsonc e exige "main", quebrando deploy so de assets.
          # Wrangler 4 suporta Worker apenas com assets, sem entry point.
          wranglerVersion: "4"
          command: deploy
